<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RobiNutri - Crear Cuenta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="registro.style.css">
</head>
<body>

    <main class="register-container">
        
        <header class="header-logo">
            <img src="img/Logotipo Profesional RobiNutri.png" alt="RobiNutri Logo profesional con eslogan: ASISTENTE VIRTUAL DE IA PARA PROMOVER LA NUTRICIÓN INFANTIL" class="logo-image">
        </header>

        <div class="form-container">
            <form id="registerForm">
                
                <div class="form-row">
                    <div class="form-group half-width">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" placeholder="Tu nombre" required>
                    </div>
                    <div class="form-group half-width">
                        <label for="apellido">Apellido</label>
                        <input type="text" id="apellido" placeholder="Tu apellido" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="dob-day">Fecha de nacimiento</label>
                    <span class="helper-text">+18 obligatorio, si eres menor pide apoyo a un adulto.</span>
                    <div class="form-row date-fields">
                        <select id="dob-day" required>
                            <option value="">Día</option>
                        </select>
                        <select id="dob-month" required>
                            <option value="">Mes</option>
                        </select>
                        <select id="dob-year" required>
                            <option value="">Año</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="genero">Género</label>
                    <select id="genero" required>
                        <option value="">Selecciona tu género</option>
                        <option value="masculino">Masculino</option>
                        <option value="femenino">Femenino</option>
                        <option value="otro">Otro</option>
                        <option value="no-especificar">Prefiero no decirlo</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="email">Correo</label>
                    <input type="email" id="email" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Crea una contraseña segura" required>
                </div>

                <button type="submit">Registrarte</button>

                <p class="login-link">
                    <a href="index.html">¡Ya tengo una cuenta!</a>
                </p>

            </form>
        </div>

    </main>

    <footer>
        <p>💡 RobiNutri es el chatbot que impulsa hábitos saludables en niños a través de inteligencia artificial y educación divertida. 🍎</p>
    </footer>

    <script src="registro.script.js"></script>

</body>
</html>
